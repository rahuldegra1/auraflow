version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: auraflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: auraflow_db
      POSTGRES_USER: auraflow_user
      POSTGRES_PASSWORD: auraflow_secure_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auraflow_user -d auraflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: auraflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auraflow-orchestrator
    restart: unless-stopped
    command: python -m uvicorn auraflow.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: "postgresql+asyncpg://auraflow_user:auraflow_secure_password@postgres:5432/auraflow_db"
      REDIS_URL: "redis://redis:6379/0"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata: