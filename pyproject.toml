[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "src/auraflow/proto",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",  # Line length handled by formatter
    "B008",  # Do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "auraflow.proto.*",
    "grpc",
    "grpc.*",
    "pynvml",
    "torch",
    "torch.*",
    "prometheus_client",
    "prometheus_client.*",
]
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "auraflow.worker.service",
    "auraflow.worker.dispatcher",
]
disable_error_code = ["attr-defined", "name-defined", "operator", "index"]